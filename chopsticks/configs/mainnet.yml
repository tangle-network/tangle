# Tangle Mainnet Chopsticks Configuration
# Fork mainnet for testing runtime upgrade to Polkadot SDK stable2503

endpoint: wss://rpc.tangle.tools
build-block-mode: Instant
allow-unresolved-imports: true
mock-signature-host: true
runtime-log-level: 5

# Database for caching chain state (speeds up subsequent runs)
db: ./db/mainnet.sqlite

# Optional: Fork at specific block (uncomment to test at specific height)
# block: 1234567

# Import test accounts with sudo access for testing
import-storage:
